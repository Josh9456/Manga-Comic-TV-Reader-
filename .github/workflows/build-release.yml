name: Build and Publish Release APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. 1.0.0-beta, v1.0.5)'
        required: true
        default: '1.0.0-beta'
      release_name:
        description: 'Release Title (e.g. Manga TV 1.0.0-beta)'
        required: true
        default: 'Manga TV 1.0.0-beta'
      prerelease:
        description: 'Mark as Pre-release / Beta'
        required: true
        type: boolean
        default: true
      release_notes:
        description: 'Release description / Changelog'
        required: false
        default: 'Manga TV Comic & Manga Reader for Android TV & Google TV. Features smart D-Pad remote panning, zoom controls, smooth page turn transitions, local & USB storage exploration, and SMB network streaming.'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC -XX:MaxMetaspaceSize=512m"
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifact
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/app-release.apk release_artifacts/Manga-Comic-TV-Reader-${{ inputs.tag_name }}.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          body: ${{ inputs.release_notes }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: release_artifacts/Manga-Comic-TV-Reader-${{ inputs.tag_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
